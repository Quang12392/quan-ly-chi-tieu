<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#022c22" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- House Body with shadow -->
  <g filter="url(#shadow)">
    <!-- Chimney -->
    <path d="M 314 140 L 344 140 L 344 195 L 314 168 Z" fill="#E2E8F0" />
    
    <!-- Roof & House Structure -->
    <path d="M 256 102 
             C 260 102, 264 105, 267 108 
             L 396 222 
             C 402 227, 399 238, 390 238 
             L 364 238 
             L 364 394 
             C 364 405, 355 414, 344 414 
             L 168 414 
             C 157 414, 148 405, 148 394 
             L 148 238 
             L 122 238 
             C 113 238, 110 227, 116 222 
             L 245 108 
             C 248 105, 252 102, 256 102 Z" 
          fill="#FFFFFF" />

    <!-- Golden Coin Badge in center of house -->
    <circle cx="256" cy="315" r="62" fill="url(#coinGrad)" />
    <circle cx="256" cy="315" r="54" fill="none" stroke="#FEF3C7" stroke-width="3" opacity="0.9" />

    <!-- Dollar sign in center of coin -->
    <text x="256" y="344" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" 
          font-size="82" 
          font-weight="900" 
          text-anchor="middle" 
          fill="#FFFFFF" 
          style="user-select:none;">$</text>
  </g>
</svg>
